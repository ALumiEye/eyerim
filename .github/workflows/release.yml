name: Standalone Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm thử
        run: |
          node test/smoke.js
          node test/gallery.js
          node test/build.js
      - name: Build HTML độc lập có nhạc
        run: node tools/build.js
      - uses: actions/upload-artifact@v4
        with:
          name: eyerim-standalone
          path: release/eyerim.html
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eyerim-standalone
          path: release
      - name: Đính kèm HTML vào Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/eyerim.html
